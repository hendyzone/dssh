[package]
name = "dssh"
version = "1.2.28"
description = "Personal modern SSH client"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["devtools"] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
# SSH 协议层：交互 shell / SFTP / 端口转发
russh = "0.54"
russh-sftp = "2"
# 系统安全凭据存储（macOS Keychain / Windows Credential Manager）
keyring = { version = "3", features = ["apple-native", "windows-native"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
# GitHub 同步：纯 Rust TLS，避免依赖 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
portable-pty = "0.9"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[dev-dependencies]
# Exercise the real snapshot command with Tauri's existing mock runtime.
tauri = { version = "~2.12", features = ["test"] }
